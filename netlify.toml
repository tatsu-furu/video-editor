# Netlify の設定。GitHub の main ブランチに push すると自動でビルド・公開される。

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 全ページに COOP/COEP を付けて crossOriginIsolated を有効にする（設計書 3章）。
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ビルド成果物はファイル名にハッシュが付くので長期キャッシュしてよい。
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA なので、存在しないパスは index.html を返す。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
